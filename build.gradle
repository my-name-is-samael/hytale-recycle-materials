apply plugin: 'idea'
apply plugin: 'java'

version = '1.0.5'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
    maven {
        url = uri("${projectDir}/local-repo")
    }
}

dependencies {
    compileOnly 'com.hypixel.hytale:HytaleServer-parent:1.0-SNAPSHOT'
}

jar {
    archiveBaseName = 'RecycleMaterials'
    archiveVersion = '1.0.5'

    doLast {
        copy {
            from archiveFile
            into 'server/mods'
        }
    }
}

task shadowJar {
    description 'Builds the project and deploys to server mods directory'
    group 'build'

    dependsOn clean, build

    doLast {
        println "✅ Build completed and JAR deployed to server/mods/"
        println "🚀 Ready to start the server!"
    }
}
